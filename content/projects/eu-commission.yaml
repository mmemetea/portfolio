title: "A question of many borders → a published study"
subtitle: "European Commission — tobacco track & trace"
description: "The Commission needed to know whether tobacco could be tracked and traced across member states. I did the technical research — serialization and authentication architectures, cross-border coordination — behind the published feasibility study that became the reference for national implementations."
fullDescription: "Contributed to the European Commission's tobacco track-and-trace initiative as a freelance technical consultant. The project was part of the broader EU Tobacco Products Directive (TPD) implementation.\n\n**Scope of Work:**\n- Technical research on track-and-trace system architectures\n- Policy analysis supporting the EU's illicit trade monitoring framework\n- Evaluation of serialization and authentication technologies\n- Cross-border coordination analysis across member states\n\n**Deliverables:**\n- Contributed to the official EU report on track-and-trace feasibility studies\n- Technical recommendations for the EU-wide system specification\n\nThe resulting framework became a reference for member states implementing national track-and-trace systems."
