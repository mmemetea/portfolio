title: "One month of Excel → seven seconds"
subtitle: "tb.lx / Daimler — e-bus charging optimizer"
description: "Public-transport tenders were answered with about a month of Excel per network — timetables, battery capacity, opportunity charging, all by hand. Replaced with an OptaPlanner (Timefold) model that schedules several hundred e-buses in under seven seconds. It became a product of Daimler's public-transport division and a differentiator in every tender since."
fullDescription: "Public-transport tenders were answered with about a month of Excel per network — timetables, battery capacity, opportunity charging, all by hand. Replaced with an OptaPlanner (Timefold) model that schedules several hundred e-buses in under seven seconds.\n\nThe model handles transportation networks, timetables, battery capacity and opportunity-charging constraints, including battery degradation, charging infrastructure limits, and passenger demand across heterogeneous fleets.\n\nBuilt as a product for Daimler's public transport division (EvoBus), enabling real-time digital planning that transformed how transport operators responded to RFPs. The product became a core differentiator for tb.lx in the public transport market."
